<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/docs.css' | relative_url }}">
  </head>
  <body>
    <div class="docs-shell">
      <aside class="docs-sidebar" aria-label="Documentation navigation">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark">CA</span>
          <span>
            <strong>CoAutoResearch</strong>
            <small>Research scaffold</small>
          </span>
        </a>
        <nav>
          <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Overview</a>
          <a href="{{ '/getting-started.html' | relative_url }}" {% if page.url contains 'getting-started' %}aria-current="page"{% endif %}>Getting Started</a>
          <a href="{{ '/conceptual-framework.html' | relative_url }}" {% if page.url contains 'conceptual-framework' %}aria-current="page"{% endif %}>Concepts</a>
          <a href="{{ '/cli.html' | relative_url }}" {% if page.url contains 'cli' %}aria-current="page"{% endif %}>CLI Reference</a>
          <a href="{{ '/multiple-projects.html' | relative_url }}" {% if page.url contains 'multiple-projects' %}aria-current="page"{% endif %}>Multiple Projects</a>
          <a href="{{ '/remote-server.html' | relative_url }}" {% if page.url contains 'remote-server' %}aria-current="page"{% endif %}>Remote Servers</a>
          <a href="{{ '/platforms.html' | relative_url }}" {% if page.url contains 'platforms' %}aria-current="page"{% endif %}>Platform Support</a>
          <a href="{{ '/upgrading.html' | relative_url }}" {% if page.url contains 'upgrading' %}aria-current="page"{% endif %}>Upgrading</a>
        </nav>
      </aside>
      <main class="docs-main">
        <header class="mobile-header">
          <a class="brand compact" href="{{ '/' | relative_url }}">
            <span class="brand-mark">CA</span>
            <strong>CoAutoResearch</strong>
          </a>
          <details class="mobile-nav">
            <summary>Menu</summary>
            <nav>
              <a href="{{ '/' | relative_url }}">Overview</a>
              <a href="{{ '/getting-started.html' | relative_url }}">Getting Started</a>
              <a href="{{ '/conceptual-framework.html' | relative_url }}">Concepts</a>
              <a href="{{ '/cli.html' | relative_url }}">CLI Reference</a>
              <a href="{{ '/multiple-projects.html' | relative_url }}">Multiple Projects</a>
              <a href="{{ '/remote-server.html' | relative_url }}">Remote Servers</a>
              <a href="{{ '/platforms.html' | relative_url }}">Platform Support</a>
              <a href="{{ '/upgrading.html' | relative_url }}">Upgrading</a>
            </nav>
          </details>
        </header>
        <article class="content">
          {{ content }}
        </article>
      </main>
    </div>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
      mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "strict" });
      const blocks = document.querySelectorAll("code.language-mermaid, pre code.language-mermaid");
      blocks.forEach((code, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "mermaid";
        wrapper.textContent = code.textContent;
        const container = code.closest(".highlight") || code.closest("pre") || code;
        container.replaceWith(wrapper);
      });
      if (blocks.length) mermaid.run();
    </script>
  </body>
</html>
