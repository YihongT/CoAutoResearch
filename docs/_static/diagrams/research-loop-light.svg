<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img"><title>Research review and recording loop</title><desc>Human direction, observation, staged proposal, required reviews, service merge decision and goal gate. Publishable work is recorded by a recoverable transaction and receipt. Needs-human returns to human direction; blocked or terminal returns to the Research Board.</desc><rect width="960" height="640" rx="20" fill="#faf8f1"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="42" fill="#686256" font-size="13" letter-spacing="2">COAUTORESEARCH · RESEARCH REVIEW LOOP</text><rect x="32" y="80" width="272" height="106" rx="12" fill="#ffffff" stroke="#ddd7c9"/><text x="50" y="118" fill="#26241f" font-size="20">Human direction</text><text x="50" y="150" fill="#686256" font-size="15">Brief or intervention</text><rect x="344" y="80" width="272" height="106" rx="12" fill="#ffffff" stroke="#ddd7c9"/><text x="362" y="118" fill="#26241f" font-size="20">Observe current revision</text><text x="362" y="150" fill="#686256" font-size="15">Read coherent canonical state</text><rect x="656" y="80" width="272" height="106" rx="12" fill="#ffffff" stroke="#ddd7c9"/><text x="674" y="118" fill="#26241f" font-size="20">Propose a bounded trial</text><text x="674" y="150" fill="#686256" font-size="15">Stage files and material hash</text><rect x="656" y="226" width="272" height="106" rx="12" fill="#ffffff" stroke="#ddd7c9"/><text x="674" y="264" fill="#26241f" font-size="20">Close required reviews</text><text x="674" y="296" fill="#686256" font-size="15">Derive route and reviewer set</text><rect x="344" y="226" width="272" height="106" rx="12" fill="#ffffff" stroke="#ddd7c9"/><text x="362" y="264" fill="#26241f" font-size="20">Derive merge decision</text><text x="362" y="296" fill="#686256" font-size="15">Service evaluates the goal gate</text><rect x="32" y="226" width="272" height="106" rx="12" fill="#ffffff" stroke="#ddd7c9"/><text x="50" y="264" fill="#26241f" font-size="20">Record accepted changes</text><text x="50" y="296" fill="#686256" font-size="15">Recoverable transaction + receipt</text><rect x="32" y="402" width="896" height="102" rx="12" fill="#ffffff" stroke="#ddd7c9"/><text x="50" y="440" fill="#26241f" font-size="20">Research Board</text><text x="50" y="472" fill="#686256" font-size="15">Continue, request input or stop</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#826528"/></marker></defs><path d="M304 130 H340" fill="none" stroke="#826528" stroke-width="1.5" marker-end="url(#a)"/><path d="M616 130 H652" fill="none" stroke="#826528" stroke-width="1.5" marker-end="url(#a)"/><path d="M792 186 V222" fill="none" stroke="#826528" stroke-width="1.5" marker-end="url(#a)"/><path d="M656 275 H620" fill="none" stroke="#826528" stroke-width="1.5" marker-end="url(#a)"/><path d="M344 275 H308" fill="none" stroke="#826528" stroke-width="1.5" marker-end="url(#a)"/><path d="M168 332 V398" fill="none" stroke="#826528" stroke-width="1.5" marker-end="url(#a)"/><path d="M480 226 V190 H168 V186" fill="none" stroke="#826528" stroke-width="1.5" marker-end="url(#a)"/><path d="M480 332 V398" fill="none" stroke="#826528" stroke-width="1.5" marker-end="url(#a)"/><path d="M928 452 H944 V60 H480 V76" fill="none" stroke="#826528" stroke-width="1.5" marker-end="url(#a)"/><text x="332" y="213" fill="#686256" font-size="13">needs_human</text><text x="40" y="354" fill="#686256" font-size="13">publishable path</text><text x="495" y="378" fill="#686256" font-size="13">blocked or terminal</text><text x="680" y="57" fill="#686256" font-size="13">continue when appropriate</text><text x="32" y="560" fill="#26241f" font-size="20">Reviewed proposals become current only through service-owned recording.</text><text x="32" y="596" fill="#686256" font-size="17">A review pass is a workflow check, not proof of a scientific claim.</text></g></svg>
