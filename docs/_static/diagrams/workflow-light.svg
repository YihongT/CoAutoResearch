<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>Workflow</title><desc>Define a research brief, start autonomous trials, optionally discuss and send guidance, inspect evidence, and request a paper draft.</desc><rect width="1200" height="640" rx="22" fill="#faf8f1"/><g font-family="Arial, Helvetica, sans-serif"><path d="M320.00 213.00 L462.00 213.00" fill="none" stroke="#ded9cb" stroke-width="1.6" stroke-linejoin="round"/><path d="M455.85692206676737 216.35597877022943 L462 213 L455.85692206676737 209.64402122977057" stroke="#ded9cb" stroke-width="1.6" fill="none"/><path d="M740.00 213.00 L880.00 213.00" fill="none" stroke="#ded9cb" stroke-width="1.6" stroke-linejoin="round"/><path d="M873.8569220667674 216.35597877022943 L880 213 L873.8569220667674 209.64402122977057" stroke="#ded9cb" stroke-width="1.6" fill="none"/><path d="M181.00 266.00 L181.00 385.00" fill="none" stroke="#ded9cb" stroke-width="1.6" stroke-linejoin="round"/><path d="M177.64402122977057 378.85692206676737 L181 385 L184.35597877022943 378.85692206676737" stroke="#ded9cb" stroke-width="1.6" fill="none"/><path d="M320.00 438.00 L462.00 438.00" fill="none" stroke="#ded9cb" stroke-width="1.6" stroke-linejoin="round"/><path d="M455.85692206676737 441.3559787702294 L462 438 L455.85692206676737 434.6440212297706" stroke="#ded9cb" stroke-width="1.6" fill="none"/><path d="M601.00 385.00 L601.00 266.00" fill="none" stroke="#ded9cb" stroke-width="1.6" stroke-linejoin="round"/><path d="M604.3559787702294 272.14307793323263 L601 266 L597.6440212297706 272.14307793323263" stroke="#ded9cb" stroke-width="1.6" fill="none"/><path d="M1019.00 266.00 L1019.00 385.00" fill="none" stroke="#ded9cb" stroke-width="1.6" stroke-linejoin="round"/><path d="M1015.6440212297706 378.85692206676737 L1019 385 L1022.3559787702294 378.85692206676737" stroke="#ded9cb" stroke-width="1.6" fill="none"/><text x="42" y="42" fill="#96712b" font-size="12" font-weight="600" text-anchor="start">COAUTORESEARCH / WORKFLOW</text><text x="42" y="83" fill="#25251f" font-size="30" font-weight="600" text-anchor="start">From a question to a research draft.</text><rect x="42" y="163" width="278" height="106" rx="13" fill="#efecE3"/><rect x="42" y="160" width="278" height="106" rx="13" fill="#ffffff" stroke="#ded9cb"/><rect x="60" y="179" width="36" height="36" rx="9" fill="#f3eddf"/><path d="M6 2 H21 L28 9 V30 H6 Z M21 2 V9 H28 M11 15 H23 M11 21 H23" transform="translate(62,181) scale(.95)" stroke="#96712b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/><text x="110" y="203" fill="#25251f" font-size="21" font-weight="600" text-anchor="start">Define the brief</text><text x="60" y="242" fill="#736e62" font-size="16" font-weight="400" text-anchor="start">Question, materials and boundaries</text><rect x="462" y="163" width="278" height="106" rx="13" fill="#efecE3"/><rect x="462" y="160" width="278" height="106" rx="13" fill="#ffffff" stroke="#ded9cb"/><rect x="480" y="179" width="36" height="36" rx="9" fill="#f3eddf"/><path d="M8 3 L28 16 L8 29 Z" transform="translate(482,181) scale(.95)" stroke="#96712b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/><text x="530" y="203" fill="#25251f" font-size="21" font-weight="600" text-anchor="start">Start autoresearch</text><text x="480" y="242" fill="#736e62" font-size="16" font-weight="400" text-anchor="start">Review the direction first</text><rect x="880" y="163" width="278" height="106" rx="13" fill="#efecE3"/><rect x="880" y="160" width="278" height="106" rx="13" fill="#ffffff" stroke="#ded9cb"/><rect x="898" y="179" width="36" height="36" rx="9" fill="#f3eddf"/><path d="M3 4 H14 L16 7 L18 4 H29 V29 H18 L16 32 L14 29 H3 Z M16 7 V32" transform="translate(900,181) scale(.95)" stroke="#96712b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/><text x="948" y="203" fill="#25251f" font-size="21" font-weight="600" text-anchor="start">Inspect findings</text><text x="898" y="242" fill="#736e62" font-size="16" font-weight="400" text-anchor="start">Read results and limitations</text><rect x="42" y="388" width="278" height="106" rx="13" fill="#efecE3"/><rect x="42" y="385" width="278" height="106" rx="13" fill="#ffffff" stroke="#ded9cb"/><rect x="60" y="404" width="36" height="36" rx="9" fill="#f3eddf"/><path d="M3 4 H29 V23 H13 L5 30 V23 H3 Z M9 11 H23 M9 17 H19" transform="translate(62,406) scale(.95)" stroke="#96712b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/><text x="110" y="428" fill="#25251f" font-size="21" font-weight="600" text-anchor="start">Discuss an idea</text><text x="60" y="467" fill="#736e62" font-size="16" font-weight="400" text-anchor="start">Use a separate research chat</text><rect x="462" y="388" width="278" height="106" rx="13" fill="#efecE3"/><rect x="462" y="385" width="278" height="106" rx="13" fill="#ffffff" stroke="#ded9cb"/><rect x="480" y="404" width="36" height="36" rx="9" fill="#f3eddf"/><path d="M3 8 H29 M3 24 H29 M10 3 V13 M22 19 V29" transform="translate(482,406) scale(.95)" stroke="#96712b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/><text x="530" y="428" fill="#25251f" font-size="21" font-weight="600" text-anchor="start">Send guidance</text><text x="480" y="467" fill="#736e62" font-size="16" font-weight="400" text-anchor="start">Add to draft → review → send</text><rect x="880" y="388" width="278" height="106" rx="13" fill="#efecE3"/><rect x="880" y="385" width="278" height="106" rx="13" fill="#ffffff" stroke="#ded9cb"/><rect x="898" y="404" width="36" height="36" rx="9" fill="#f3eddf"/><path d="M6 2 H21 L28 9 V30 H6 Z M21 2 V9 H28 M11 15 H23 M11 21 H23" transform="translate(900,406) scale(.95)" stroke="#96712b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/><text x="948" y="428" fill="#25251f" font-size="21" font-weight="600" text-anchor="start">Generate paper</text><text x="898" y="467" fill="#736e62" font-size="16" font-weight="400" text-anchor="start">Choose a format; inspect the draft</text><text x="42" y="326" fill="#96712b" font-size="12" font-weight="600" text-anchor="start">RESEARCHER</text><text x="240" y="326" fill="#736e62" font-size="17" font-weight="400" text-anchor="start">Discuss alongside research. Pause at a turn boundary when needed.</text><path d="M42 116 H1158" stroke="#ded9cb"/><rect x="42" y="542" width="1116" height="52" rx="12" fill="#f3eddf"/><text x="42" y="620" fill="#736e62" font-size="11" font-weight="400" text-anchor="start">ILLUSTRATED WORKFLOW · NOT ACTUAL RUN TIME</text><text x="62" y="575" fill="#736e62" font-size="17" font-weight="400" text-anchor="start">Research remains subject to your direction, review and resource limits.</text></g></svg>
