418" fill="#f3f0e6" font-size="21" font-weight="600" text-anchor="start">Recorded revision</text><text x="480" y="457" fill="#b5b1a4" font-size="16" font-weight="400" text-anchor="start">Recoverable transaction + receipt</text><rect x="42" y="378" width="278" height="106" rx="13" fill="#121310"/><rect x="42" y="375" width="278" height="106" rx="13" fill="#22231f" stroke="#45463c"/><rect x="60" y="394" width="36" height="36" rx="9" fill="#343124"/><path d="M6 2 H21 L28 9 V30 H6 Z M21 2 V9 H28 M11 15 H23 M11 21 H23" transform="translate(62,396) scale(.95)" stroke="#d8b875" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" fill="none"/><text x="110" y="418" fill="#f3f0e6" font-size="21" font-weight="600" text-anchor="start">Research Board</text><text x="60" y="457" fill="#b5b1a4" font-size="16" font-weight="400" text-anchor="start">Continue, request input or stop</text><text x="795" y="422" fill="#b5b1a4" font-size="13" font-weight="400" text-anchor="middle">publishable</text><text x="390" y="422" fill="#b5b1a4" font-size="13" font-weight="400" text-anchor="middle">record</text><text x="197" y="320" fill="#b5b1a4" font-size="13" font-weight="400" text-anchor="start">continue</text><text x="572" y="303" fill="#b5b1a4" font-size="14" font-weight="400" text-anchor="middle">needs_human / blocked / terminal</text><path d="M42 116 H1158" stroke="#45463c"/><rect x="42" y="542" width="1116" height="52" rx="12" fill="#343124"/><text x="42" y="620" fill="#b5b1a4" font-size="11" font-weight="400" text-anchor="start">ILLUSTRATED WORKFLOW · NOT ACTUAL RUN TIME</text><text x="62" y="575" fill="#b5b1a4" font-size="17" font-weight="400" text-anchor="start">Research remains subject to your direction, review and resource limits.</text></g></svg>
