<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">System Architecture</title>
<desc id="desc">The browser sends controls to a local service. The service supervises coding agents, checks proposed research changes and records accepted evidence. Separate read-only discussion and isolated paper writing preserve research boundaries.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#d7b775" stroke-width="1.5"/></marker></defs>
<rect width="960" height="640" rx="20" fill="#171813"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="42" fill="#bcb6a6" font-size="13" letter-spacing="2">COAUTORESEARCH · SYSTEM ARCHITECTURE</text>
<rect x="32" y="80" width="240" height="190" rx="12" fill="#22231d" stroke="#464439"/>
<text x="52" y="110" fill="#d7b775" font-size="13" letter-spacing="1.5">INTERFACE</text>
<text x="52" y="143" fill="#f4f0e5" font-size="23" >Browser workspace</text>
<text x="52" y="177" fill="#bcb6a6" font-size="17" >Brief and research chat</text>
<text x="52" y="202" fill="#bcb6a6" font-size="17" >Discussion and controls</text>
<text x="52" y="227" fill="#bcb6a6" font-size="17" >Evidence and paper views</text>
<rect x="344" y="80" width="272" height="190" rx="12" fill="#22231d" stroke="#464439"/>
<text x="364" y="110" fill="#d7b775" font-size="13" letter-spacing="1.5">COORDINATION</text>
<text x="364" y="143" fill="#f4f0e5" font-size="23" >Local service</text>
<text x="364" y="177" fill="#bcb6a6" font-size="17" >Validate and queue actions</text>
<text x="364" y="202" fill="#bcb6a6" font-size="17" >Supervise agent processes</text>
<text x="364" y="227" fill="#bcb6a6" font-size="17" >Review and record changes</text>
<rect x="688" y="80" width="240" height="190" rx="12" fill="#22231d" stroke="#464439"/>
<text x="708" y="110" fill="#d7b775" font-size="13" letter-spacing="1.5">EXECUTION</text>
<text x="708" y="143" fill="#f4f0e5" font-size="23" >Coding agents</text>
<text x="708" y="177" fill="#bcb6a6" font-size="17" >Codex or Claude Code</text>
<text x="708" y="202" fill="#bcb6a6" font-size="17" >Existing account login</text>
<text x="708" y="227" fill="#bcb6a6" font-size="17" >Bounded project work</text>
<path d="M272 174 H334" fill="none" stroke="#d7b775" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M616 174 H678" fill="none" stroke="#d7b775" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="308" y="151" fill="#bcb6a6" font-size="13" text-anchor="middle">HTTP</text>
<text x="652" y="151" fill="#bcb6a6" font-size="13" text-anchor="middle">CLI</text>
<rect x="32" y="340" width="272" height="180" rx="12" fill="#22231d" stroke="#464439"/>
<text x="52" y="370" fill="#d7b775" font-size="13" letter-spacing="1.5">PROJECT FILES</text>
<text x="52" y="403" fill="#f4f0e5" font-size="23" >Research record</text>
<text x="52" y="437" fill="#bcb6a6" font-size="17" >Brief · Resources · Trials</text>
<text x="52" y="462" fill="#bcb6a6" font-size="17" >Reviewed results and limits</text>
<text x="52" y="487" fill="#bcb6a6" font-size="17" >Manuscript + provenance</text>
<rect x="344" y="340" width="272" height="180" rx="12" fill="#22231d" stroke="#464439"/>
<text x="364" y="370" fill="#d7b775" font-size="13" letter-spacing="1.5">PARALLEL DISCUSSION</text>
<text x="364" y="403" fill="#f4f0e5" font-size="23" >Auxiliary chat</text>
<text x="364" y="437" fill="#bcb6a6" font-size="17" >Reads research context</text>
<text x="364" y="462" fill="#bcb6a6" font-size="17" >Keeps separate chat history</text>
<text x="364" y="487" fill="#bcb6a6" font-size="17" >Suggestions return via drafts</text>
<rect x="656" y="340" width="272" height="180" rx="12" fill="#22231d" stroke="#464439"/>
<text x="676" y="370" fill="#d7b775" font-size="13" letter-spacing="1.5">ISOLATED WRITING</text>
<text x="676" y="403" fill="#f4f0e5" font-size="23" >Paper generation</text>
<text x="676" y="437" fill="#bcb6a6" font-size="17" >Frozen evidence snapshot</text>
<text x="676" y="462" fill="#bcb6a6" font-size="17" >Four skills + LaTeX tools</text>
<text x="676" y="487" fill="#bcb6a6" font-size="17" >PDF, source and review notes</text>
<path d="M400 270 V304 H168 V330" fill="none" stroke="#d7b775" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M480 270 V330" fill="none" stroke="#d7b775" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 270 V304 H792 V330" fill="none" stroke="#d7b775" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="32" y="566" fill="#f4f0e5" font-size="20" >The service records accepted changes; agents propose them.</text>
<text x="32" y="601" fill="#bcb6a6" font-size="17" >Discussion does not edit research files. Paper writing does not run new experiments.</text>
</g></svg>
