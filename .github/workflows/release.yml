name: Release

on:
  release:
    types: [published]

jobs:
  npm-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm test
      - run: npm pack --dry-run
      # To publish later, configure npm trusted publishing or NODE_AUTH_TOKEN,
      # then replace the dry run with:
      # npm publish --provenance --access public
