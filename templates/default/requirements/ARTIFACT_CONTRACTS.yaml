spec_version: 2.0.0
json_authority: Machine JSON is authoritative. Markdown is generated from or consistency-checked against JSON.
unknown_fields: Rejected unless nested under extensions.
artifacts:
- key: canonical_revision
  schema: schemas/canonical-revision.schema.json
  path: research_trajectory/CANONICAL_REVISION.json
  writer: service_transaction_applier
  phase: publish
  paired_markdown: false
  canonical: true
- key: project_state
  schema: schemas/project-state.schema.json
  path: research_trajectory/STATE.json
  writer: service_transaction_applier_from_reviewed_candidate
  phase: publish
  paired_markdown: research_trajectory/STATE.md
  canonical: true
- key: current_findings
  schema: schemas/current-findings.schema.json
  path: research_trajectory/CURRENT_FINDINGS.json
  writer: service_transaction_applier_from_reviewed_candidate
  phase: publish
  paired_markdown: research_trajectory/CURRENT_FINDINGS.md
  canonical: true
- key: human_tasks
  schema: schemas/human-tasks.schema.json
  path: research_trajectory/HUMAN_TASKS.json
  writer: service_transaction_applier_from_reviewed_candidate
  phase: publish
  paired_markdown: research_trajectory/HUMAN_TASKS.md
  canonical: true
- key: research_line
  schema: schemas/line.schema.json
  path_pattern: research_trajectory/lines/L[0-9]{4}.json
  writer: service_transaction_applier_from_reviewed_candidate
  phase: publish
  paired_markdown_pattern: research_trajectory/lines/L[0-9]{4}.md
  canonical: true
- key: campaign
  schema: schemas/campaign.schema.json
  path_pattern: research_trajectory/campaigns/C[0-9]{4}.json
  writer: service_transaction_applier_from_reviewed_candidate
  phase: publish
  paired_markdown_pattern: research_trajectory/campaigns/C[0-9]{4}.md
  canonical: true
- key: target_venue
  schema: schemas/target-venue.schema.json
  path: resources/target_venue/TARGET_VENUE.json
  writer: service_transaction_applier_from_reviewed_candidate
  phase: publish
  paired_markdown: resources/target_venue/TARGET_VENUE.md
  canonical: true
- key: venue_profile
  schema: schemas/venue-profile.schema.json
  path: resources/target_venue/VENUE_PROFILE.json
  writer: service_transaction_applier_from_reviewed_candidate
  phase: publish
  paired_markdown: resources/target_venue/VENUE_PROFILE.md
  canonical: true
- key: trial
  schema: schemas/trial.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/TRIAL.json
  writer: service_scaffolder_then_agent_status_proposal_then_service_transaction_finalizer
  phase: charter_to_publish
  paired_markdown: null
  canonical: false
- key: plan
  schema: schemas/plan.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/PLAN.json
  writer: current_agent
  phase: charter
  paired_markdown_pattern: research_trajectory/trials/<trial_id>/PLAN.md
  canonical: false
- key: expert_route
  schema: schemas/expert-route.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/EXPERT_ROUTE.json
  writer: current_agent
  phase: route
  paired_markdown_pattern: research_trajectory/trials/<trial_id>/EXPERT_ROUTE.md
  canonical: false
- key: report
  schema: schemas/report.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/REPORT.json
  writer: current_agent
  phase: distill
  paired_markdown_pattern: research_trajectory/trials/<trial_id>/REPORT.md
  canonical: false
- key: result_cards
  schema: schemas/result-cards.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/RESULT_CARDS.json
  writer: current_agent
  phase: distill
  paired_markdown_pattern: research_trajectory/trials/<trial_id>/RESULT_CARDS.md
  canonical: false
  immutability: Payload is immutable after first complete distillation; corrections create a superseding card.
- key: merge_request
  schema: schemas/merge-request.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/MERGE_REQUEST.json
  writer: current_agent
  phase: distill_and_stage
  paired_markdown_pattern: research_trajectory/trials/<trial_id>/MERGE_REQUEST.md
  canonical: false
- key: staged_update_manifest
  schema: schemas/staged-update-manifest.schema.json
  path_pattern: research_trajectory/.staging/<trial_id>/<stage_id>/STAGED_UPDATE_MANIFEST.json
  writer: service_staging_controller
  phase: stage
  paired_markdown: false
  canonical: false
  hash_contract: Enumerates all material inputs and candidate operations; stage_content_hash follows hash_spec_version 1 with
    deterministic sorted canonical serialization.
- key: human_brief
  schema: schemas/human-brief.schema.json
  path_pattern: research_trajectory/.staging/<trial_id>/<stage_id>/HUMAN_BRIEF.json
  published_path_pattern: research_trajectory/trials/<trial_id>/HUMAN_BRIEF.json
  writer: current_agent_then_service_publication
  phase: stage_review_publish
  paired_markdown_pattern: research_trajectory/.staging/<trial_id>/<stage_id>/HUMAN_BRIEF.md
  published_paired_markdown_pattern: research_trajectory/trials/<trial_id>/HUMAN_BRIEF.md
  canonical: published_only
  note: Uses neutral outcome language; global status comes from GOAL_GATE and applied-change labels come from published MERGE_DECISION
    plus PUBLISH_RECEIPT.
- key: gate_evidence
  schema: schemas/gate-evidence.schema.json
  path_pattern: research_trajectory/.staging/<trial_id>/<stage_id>/GATE_EVIDENCE.json
  writer: current_agent
  phase: stage
  paired_markdown_pattern: research_trajectory/.staging/<trial_id>/<stage_id>/GATE_EVIDENCE.md
  canonical: false
- key: review_manifest
  schema: schemas/review-manifest.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/reviews/REVIEW_MANIFEST.json
  writer: service_review_router
  phase: review_route
  paired_markdown_pattern: research_trajectory/trials/<trial_id>/reviews/REVIEW_MANIFEST.md
  canonical: closure_metadata
- key: reviewer_output
  schema: schemas/reviewer-output.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/reviews/<reviewer>.json
  writer: reviewer_invocation
  phase: review
  paired_markdown_pattern: research_trajectory/trials/<trial_id>/reviews/<reviewer>.md
  canonical: closure_metadata
  stale_rule: stage_id and stage_manifest_hash must match the final reviewed stage.
- key: merge_decision
  schema: schemas/merge-decision.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/MERGE_DECISION.json
  writer: service_merge_evaluator
  phase: after_review_closure
  paired_markdown_pattern: research_trajectory/trials/<trial_id>/MERGE_DECISION.md
  canonical: published_trial_decision
  rejected_semantics: overall_status=rejected is non-publishable and returns the trial to repair or explicit invalidation.
- key: goal_gate
  schema: schemas/goal-gate.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/GOAL_GATE.json
  writer: service_gate_evaluator
  phase: after_merge_decision
  paired_markdown_pattern: research_trajectory/trials/<trial_id>/GOAL_GATE.md
  canonical: published_global_status
- key: transaction_manifest
  schema: schemas/transaction-manifest.schema.json
  path_pattern: research_trajectory/.transactions/<transaction_id>/TRANSACTION_MANIFEST.json
  writer: service_transaction_applier
  phase: publish
  paired_markdown: false
  canonical: audit_metadata
- key: publish_receipt
  schema: schemas/publish-receipt.schema.json
  path_pattern: research_trajectory/trials/<trial_id>/PUBLISH_RECEIPT.json
  writer: service_transaction_applier
  phase: committed
  paired_markdown_pattern: research_trajectory/trials/<trial_id>/PUBLISH_RECEIPT.md
  canonical: publication_proof
- key: semantic_trace
  schema: schemas/semantic-trace.schema.json
  transport: existing_research_SSE_stream
  writer: service_and_agent_trace_adapter
  phase: runtime
  paired_markdown: false
  canonical: false
