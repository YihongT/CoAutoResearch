v2_retry_or_recovery_status:
  agent_failed: retry the same phase, trial, and trustworthy stage with a fresh guard baseline
  interrupted: resume the same phase, trial, and trustworthy stage after process-tree drain and guard audit
  protocol_violation: restore protected writes from the exact guard and require explicit safe retry or stage renewal
  recovery_required: block until guard, transaction, migration, or trusted runtime corruption is resolved
  stage_resolution_required: block automatic launch until an unmatched orphan stage is resolved
  repair_limit_reached: stop only after the configured number of material research revisions, never for infrastructure failures
